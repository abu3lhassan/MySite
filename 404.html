<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Ali Alhanabi</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .error-shell {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 2rem;
    }
    .error-code {
      font-size: 6rem;
      font-weight: 900;
      color: rgba(255,255,255,0.08);
      line-height: 1;
      margin-bottom: 1rem;
      letter-spacing: -0.05em;
    }
    .error-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 1rem;
    }
    .error-body {
      font-size: 1rem;
      color: rgba(255,255,255,0.45);
      margin-bottom: 2.5rem;
      max-width: 400px;
    }
    .error-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: #ffffff;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    .error-link:hover {
      background: rgba(255,255,255,0.1);
    }
  </style>
</head>
<body>
  <nav class="nav-shell">
    <a class="nav-logo" href="/index.html">
      <span class="logo-mark">AA</span>
      <span class="logo-name">Ali Alhanabi</span>
    </a>
  </nav>
  <main class="error-shell">
    <div class="error-code">404</div>
    <h1 class="error-title">Page not found</h1>
    <p class="error-body">The page you're looking for doesn't exist or has been moved.</p>
    <a class="error-link" href="/index.html">← Back to home</a>
  </main>
</body>
</html>
