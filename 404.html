<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Ali Al-Hanabi</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .error-shell {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 2rem;
    }
    .error-code {
      font-size: 6rem;
      font-weight: 900;
      color: rgba(255,255,255,0.08);
      line-height: 1;
      margin-bottom: 1rem;
      letter-spacing: -0.05em;
    }
    .error-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 1rem;
    }
    .error-body {
      font-size: 1rem;
      color: rgba(255,255,255,0.45);
      margin-bottom: 2.5rem;
      max-width: 400px;
    }
    .error-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: #ffffff;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    .error-link:hover {
      background: rgba(255,255,255,0.1);
    }
  </style>
  <link rel="icon" href="/favicon.ico?v=signature-b" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=signature-b">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png?v=signature-b">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png?v=signature-b">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=signature-b">
</head>
<body>
  <nav class="nav-shell">
    <a class="nav-logo brand signature-brand" href="/index.html" aria-label="Ali Al-Hanabi home"><img class="signature-monogram" src="/assets/signature-executive-monogram.svg" width="40" height="40" alt="" aria-hidden="true"><img class="signature-wordmark" src="/assets/signature-executive-wordmark.svg" width="148" height="23" alt="Ali Al-Hanabi"></a>
  </nav>
  <main class="error-shell">
    <div class="error-code">404</div>
    <h1 class="error-title">Page not found</h1>
    <p class="error-body">The page you're looking for doesn't exist or has been moved.</p>
    <a class="error-link" href="/index.html">← Back to home</a>
  </main>
  <script>
    (() => {
      let ar = false;
      try { ar = localStorage.getItem('portfolio_lang') === 'ar'; } catch {}
      if (!ar) return;
      document.documentElement.lang = 'ar';
      document.documentElement.dir = 'rtl';
      document.title = 'الصفحة غير موجودة — علي الحنابي';
      document.querySelector('.error-title').textContent = 'الصفحة غير موجودة';
      document.querySelector('.error-body').textContent = 'الصفحة المطلوبة غير موجودة أو تم نقلها.';
      document.querySelector('.error-link').textContent = 'العودة إلى الرئيسية ←';
    })();
  </script>
</body>
</html>
